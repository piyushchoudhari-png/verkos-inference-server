# VLM GPU profiling simulator config
# Run: python -m src --config src/config/sim_config.yaml

# inference_mode: "local" uses a vLLM engine on this machine
# inference_mode: "openrouter" sends requests to OpenRouter API
inference_mode: openrouter

# Required when inference_mode = openrouter
# api_key is read from OPENROUTER_API_KEY in .env (never put it here)
openrouter:
  model: "qwen/qwen3-vl-32b-instruct"
  base_url: "https://openrouter.ai/api/v1"
  timeout_s: 60.0

# Required when inference_mode = local
model_path: "/home/capybara/code/flytbase/verkos-inference-server/models/smolvlm-256m"

video_paths:
  - "/home/capybara/code/flytbase/verkos-inference-server/src/data/input4.mp4"

prompts_file: "/home/capybara/code/flytbase/verkos-inference-server/src/config/prompts.yaml"

num_feeds: 1
frame_interval_s: 2.0
max_frames_per_feed: 20

downscale_factor: null
# resolution: [640, 360]

gpu_poll_interval_s: 0.5

max_tokens: 812
temperature: 0.0
dtype: "auto"
gpu_memory_utilization: 0.90
tensor_parallel_size: 1

# Qwen3-VL image preprocessing budget. Must match HF defaults (which OpenRouter uses)
# or the model sees a downsampled image and cannot spatially ground objects.
# Units are pixels; 28*28 is the patch size, so values are typically <patches>*28*28.
mm_processor_kwargs:
  min_pixels: 3136       # 4 * 28 * 28
  max_pixels: 12845056   # 16384 * 28 * 28 (~12.8M px)
limit_mm_per_prompt:
  image: 1

output_dir: "./runs"
# run_id: "my_run_001"
