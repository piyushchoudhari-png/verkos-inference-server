# VLM GPU profiling simulator config
# Run: python -m simulator --config simulator/examples/sim_config.yaml

model_path: "/home/capybara/code/flytbase/verkos-inference-server/models/smolvlm-256m" # path to model weights on disk

video_paths:
  - "/home/capybara/code/flytbase/verkos-inference-server/simulator/data/video.mp4" # one MP4 per feed; cycled if num_feeds > len

prompts_file: "/home/capybara/code/flytbase/verkos-inference-server/simulator/config/prompts.yaml"

# Concurrency: how many drone feeds to simulate in parallel
num_feeds: 1

# How often each feed samples a frame (seconds between frames)
frame_interval_s: 10.0

# Run for this many wall-clock seconds, then stop (set either this or max_frames_per_feed)
run_duration_s: 120.0

# Hard cap on frames per feed (alternative / additional termination condition)
# max_frames_per_feed: 20

# Downscale all frames before sending to the VLM (null = native resolution)
# Mutually exclusive with resolution.
downscale_factor: null

# Explicit target resolution: [width, height] in pixels
# resolution: [640, 360]

# GPU telemetry poll interval (seconds)
gpu_poll_interval_s: 0.5

# vLLM inference knobs
max_tokens: 256
temperature: 0.7 # deterministic; set to e.g. 0.7 for stochastic sampling
dtype: "auto"
gpu_memory_utilization: 0.90
tensor_parallel_size: 1

# Output directory (Parquet + markdown summary land here)
output_dir: "./sim_results"

# Optional: fixed run_id for reproducible filenames (auto-generated UUID if absent)
# run_id: "my_run_001"
